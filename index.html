<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriel Beas — Arquitecto</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
background: #f7f5f1;
color: #1a1a1a;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
}
main {
  max-width: 560px;
text-align: center;
}
h1 {
  font-size: 2.2rem;
font-weight: 600;
letter-spacing: -0.02em;
margin-bottom: 8px;
}
p.role {
font-size: 1.05rem;
color: #6b6558;
margin-bottom: 32px;
letter-spacing: 0.02em;
text-transform: uppercase;
}
p.note {
font-size: 1rem;
line-height: 1.6;
color: #3a382f;
margin-bottom: 32px;
}
a.contact {
display: inline-block;
padding: 12px 28px;
border: 1px solid #1a1a1a;
border-radius: 999px;
color: #1a1a1a;
text-decoration: none;
font-size: 0.95rem;
transition: background 0.2s, color 0.2s;
}
a.contact:hover {
  background: #1a1a1a;
color: #f7f5f1;
}
</style>
</head>
<body>
  <main>
  <h1>Gabriel Beas</h1>
  <p class="role">Arquitecto</p>
  <p class="note">Este sitio está en construcción. Mientras tanto, puedes ver el proyecto Magnolias en <a href="https://fabrica.la/magnolias/" style="color:#1a1a1a;">fabrica.la/magnolias</a>.</p>
<a class="contact" href="mailto:gabrielbeas.mx@gmail.com">Escríbeme</a>
</main>
